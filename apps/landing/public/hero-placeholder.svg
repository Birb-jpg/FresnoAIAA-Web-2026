<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- PLACEHOLDER hero media — replace with real launch photo/video (see Hero.astro) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02040a"/>
      <stop offset="0.55" stop-color="#050a14"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.88" r="0.5">
      <stop offset="0" stop-color="#dcedff" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#7cbcf5" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#1a3a5c" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4ff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#cfe6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2f8ff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="140" cy="120" r="1.4" opacity="0.7"/>
    <circle cx="360" cy="240" r="1" opacity="0.5"/>
    <circle cx="520" cy="90" r="1.2" opacity="0.6"/>
    <circle cx="760" cy="300" r="0.9" opacity="0.4"/>
    <circle cx="930" cy="150" r="1.3" opacity="0.7"/>
    <circle cx="1120" cy="80" r="1" opacity="0.5"/>
    <circle cx="1290" cy="260" r="1.1" opacity="0.55"/>
    <circle cx="1480" cy="140" r="1.4" opacity="0.7"/>
    <circle cx="1680" cy="230" r="0.9" opacity="0.45"/>
    <circle cx="1820" cy="90" r="1.2" opacity="0.6"/>
    <circle cx="240" cy="420" r="0.8" opacity="0.35"/>
    <circle cx="660" cy="480" r="1" opacity="0.4"/>
    <circle cx="1050" cy="420" r="0.9" opacity="0.35"/>
    <circle cx="1420" cy="470" r="1" opacity="0.4"/>
    <circle cx="1740" cy="400" r="0.8" opacity="0.3"/>
  </g>
  <!-- ascent trail + exhaust glow -->
  <rect x="1186" y="360" width="6" height="520" rx="3" fill="url(#trail)"/>
  <circle cx="1190" cy="950" r="480" fill="url(#glow)"/>
  <text x="960" y="560" text-anchor="middle" font-family="monospace" font-size="28" fill="#3a4a5e" letter-spacing="6">PLACEHOLDER LAUNCH MEDIA</text>
</svg>
